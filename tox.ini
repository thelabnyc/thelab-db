[tox]
isolated_build = True
toxworkdir={env:TOX_WORK_DIR:.tox}
envlist = py{314,315}-django{520,600,610}

[testenv]
runner = uv-venv-runner
passenv = *
allowlist_externals =
    bash
deps =
    django520: django>=5.2,<5.3
    django600: django>=6.0,<6.1
    django610: django>=6.1,<6.2
commands =
    mypy {toxinidir}/thelabdb/
    coverage run \
        manage.py test \
        --noinput \
        -v 2 \
        --buffer \
        {env:TEST_PKGS:thelabdb.tests.testsuniv}
    coverage report -i -m
    coverage xml
